<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>mnemo capture — options</title>
    <style>
      :root { color-scheme: light dark; }
      body { font: 14px system-ui, sans-serif; margin: 24px; max-width: 560px; }
      h1 { font-size: 18px; margin: 0 0 16px; }
      h2 { font-size: 15px; margin: 20px 0 8px; border-bottom: 1px solid #ccc; padding-bottom: 4px; }
      label { display: block; margin: 12px 0 4px; font-weight: 600; }
      input[type=text], input[type=url] {
        width: 100%; padding: 6px 8px; box-sizing: border-box;
        border: 1px solid #888; border-radius: 4px; font: inherit;
      }
      .row { display: flex; gap: 8px; align-items: center; }
      .hint { color: #666; font-size: 12px; margin-top: 2px; }
      button { padding: 6px 12px; font: inherit; cursor: pointer; }
      .status { margin-top: 16px; padding: 8px; border-radius: 4px; font-size: 13px; }
      .ok { background: #dfd; color: #060; }
      .err { background: #fdd; color: #900; }
      #authStatus { font-weight: 600; margin-top: 4px; font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>mnemo capture</h1>

    <h2>API</h2>

    <label for="apiUrl">mnemo API base URL</label>
    <input type="url" id="apiUrl" placeholder="https://mnemo.tiago.tools" />
    <div class="hint">Path will have <code>/events</code> appended.</div>

    <h2>Auth0</h2>

    <label for="auth0Domain">Auth0 domain</label>
    <input type="text" id="auth0Domain" value="dev-jrva0wzk3qkdxcar.us.auth0.com" />

    <label for="auth0Audience">Auth0 audience</label>
    <input type="text" id="auth0Audience" value="https://kleos.tiago.tools" />

    <label for="auth0ClientId">Auth0 client ID</label>
    <input type="text" id="auth0ClientId" value="naKbYOFItrLOwttTMZQ8pQSBJYwyJuzS" />

    <div style="margin-top: 14px;">
      <div id="authStatus">Checking…</div>
      <div class="row" style="margin-top: 8px;">
        <button id="signin">Sign in with Auth0</button>
        <button id="signout">Sign out</button>
      </div>
    </div>

    <h2>Capture</h2>

    <label for="workstation">Workstation</label>
    <input type="text" id="workstation" placeholder="chrome-extension" />
    <div class="hint">Identifies the source in mnemo. Defaults to <code>chrome-extension</code>.</div>

    <label class="row">
      <input type="checkbox" id="enabled" />
      <span>Enable capture</span>
    </label>

    <div class="row" style="margin-top: 16px;">
      <button id="save">Save</button>
      <button id="test">Test push</button>
      <span id="status" class="status" hidden></span>
    </div>
    <div id="perm" class="status" hidden style="margin-top: 12px;"></div>
    <div class="hint" style="margin-top: 8px;">
      Saving an API URL will prompt Chrome for permission to fetch that host.
      Without it, pushes are blocked by CORS.
    </div>

    <script type="module" src="options.js"></script>
  </body>
</html>
