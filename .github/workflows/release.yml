name: release
on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # QEMU registers non-native binfmt_misc interpreters so buildx
      # can produce linux/arm64 layers from this x86 runner. For
      # mnemo (Go, distroless static) there's almost no perf cost:
      # Go cross-compiles natively for both targets and QEMU never
      # executes the resulting binaries during build.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mnemo-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag
      - uses: docker/build-push-action@v5
        with:
          context: server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-cli:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json
      # Stamp cli/src/defaults.ts from repo Variables before building.
      # The committed file already holds the production defaults so
      # local builds work without this step; CI overwrites them so a
      # value change is a Variables edit, not a code change. Empty
      # variables fail the build loudly via `:?`.
      - name: Stamp CLI defaults from repo variables
        env:
          AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
          AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
          MNEMO_API_URL: ${{ vars.MNEMO_API_URL }}
        run: |
          : "${AUTH0_DOMAIN:?Set the AUTH0_DOMAIN repo variable}"
          : "${AUTH0_AUDIENCE:?Set the AUTH0_AUDIENCE repo variable}"
          : "${AUTH0_CLIENT_ID:?Set the AUTH0_CLIENT_ID repo variable}"
          : "${MNEMO_API_URL:?Set the MNEMO_API_URL repo variable}"
          cat > cli/src/defaults.ts <<EOF
          // Auto-generated by .github/workflows/release.yml from GitHub
          // repo Variables. Do not edit by hand; the committed copy in
          // the repo carries the development defaults.
          export const DEFAULTS = {
            apiUrl: '$MNEMO_API_URL',
            auth0Domain: '$AUTH0_DOMAIN',
            auth0Audience: '$AUTH0_AUDIENCE',
            auth0ClientId: '$AUTH0_CLIENT_ID',
          } as const;
          EOF
      - name: build + pack
        working-directory: cli
        run: |
          npm ci
          npm run build
          npm pack
      - name: attach tarball to release
        uses: softprops/action-gh-release@v2
        with:
          files: cli/mnemo-cli-*.tgz

  publish-extension:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Same stamping pattern as publish-cli, targeting extension/defaults.js.
      - name: Stamp extension defaults from repo variables
        env:
          AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
          AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
          MNEMO_API_URL: ${{ vars.MNEMO_API_URL }}
        run: |
          : "${AUTH0_DOMAIN:?Set the AUTH0_DOMAIN repo variable}"
          : "${AUTH0_AUDIENCE:?Set the AUTH0_AUDIENCE repo variable}"
          : "${AUTH0_CLIENT_ID:?Set the AUTH0_CLIENT_ID repo variable}"
          : "${MNEMO_API_URL:?Set the MNEMO_API_URL repo variable}"
          cat > extension/defaults.js <<EOF
          // Auto-generated by .github/workflows/release.yml from GitHub
          // repo Variables. Do not edit by hand.
          export const DEFAULTS = {
            apiUrl: '$MNEMO_API_URL',
            auth0Domain: '$AUTH0_DOMAIN',
            auth0Audience: '$AUTH0_AUDIENCE',
            auth0ClientId: '$AUTH0_CLIENT_ID',
            workstation: 'chrome-extension',
            enabled: true,
          };
          EOF
      - name: Package extension zip
        run: |
          cd extension
          # Strip dotfiles + the README so the zip is just the extension
          # surface the browser will load.
          zip -r "../mnemo-extension-${GITHUB_REF_NAME}.zip" . \
            -x '.*' '*/.*' 'README*' '*.md'
      - name: Attach zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: mnemo-extension-*.zip
